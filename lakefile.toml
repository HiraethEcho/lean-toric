name = "leanlab"

[leanOptions]
autoImplicit = true
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

# exercise/, examples/ and references/ are NOT lean_libs on purpose: exercises
# contain `sorry` while you work on them, and the other two are read-only
# reference code (references/ can't compile at all -- upstream pins an older
# toolchain). Check exercises with scripts/check.sh, which uses `lake env lean`.
#
# No lean_lib right now, so `lake build` only resolves the mathlib dependency.
# Phase 2 (the lean-toric reproduction, see the README file table) re-adds:
#
#   defaultTargets = ["Toric"]
#
#   [[lean_lib]]
#   name = "Toric"
#   srcDir = "src"
#   globs = ["Toric"]
