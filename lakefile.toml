name = "leanlab"
defaultTargets = ["Repro"]

[leanOptions]
autoImplicit = true
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

# src/Toric mirrors ~/Public/lean-toric/Toric/ -- same relative paths,
# so `diff -ru` against the reference stays meaningful.
[[lean_lib]]
name = "Repro"
srcDir = "src"
globs = ["Repro", "Toric"]
