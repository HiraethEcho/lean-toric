name = "leanlab"
defaultTargets = ["Toric"]

[leanOptions]
autoImplicit = true
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

# src/Toric/** mirrors examples/lean-toric (once copied) -- same relative paths,
# so `diff -ru` against the reference stays meaningful.
#
# exercise/ and examples/ are NOT lean_libs on purpose: exercises contain
# `sorry` while you work on them, and examples/ is read-only reference code.
# Check those with scripts/check.sh instead, which uses `lake env lean`.
[[lean_lib]]
name = "Toric"
srcDir = "src"
globs = ["Toric"]